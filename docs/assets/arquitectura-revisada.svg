<title id="titulo">Valtraza: actores, módulos y persistencia corregidos</title>
<desc id="descripcion">Administrador registra cuentas, técnicos, clientes, equipos y servicios, y supervisa. Técnico ingresa y trabaja en servicios asignados. Cliente consulta por código sin cuenta. Ocho modelos persisten en PostgreSQL.</desc>
