<text x="40" y="838" font-family="Segoe UI, sans-serif" font-size="16" fill="#536b80">Un servicio puede quedar sin técnico mientras esté pendiente. Una cuenta técnica debe vincularse a un técnico.</text>
<text x="40" y="865" font-family="Segoe UI, sans-serif" font-size="16" fill="#536b80">El cliente del servicio se obtiene por equipo. Las claves foráneas usan RESTRICT.</text>
