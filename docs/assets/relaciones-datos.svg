<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Relaciones principales de datos</title><desc id="descripcion">Siete relaciones entre ocho tablas. Cliente tiene equipos, equipo tiene servicios, técnico atiende servicios y tiene a lo sumo una cuenta; cada servicio reúne diagnósticos, trabajos y repuestos.</desc>
