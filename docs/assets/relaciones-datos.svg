<text x="40" y="48" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#163b5e">Relaciones principales de datos</text>
<rect x="40" y="115" width="300" height="115" rx="12" fill="#ffffff" stroke="#b7cce0" stroke-width="2"/>
<text x="58" y="147" font-family="Segoe UI, sans-serif" font-size="21" font-weight="650" fill="#17436b">cliente</text>
<text x="58" y="177" font-family="Segoe UI, sans-serif" font-size="17" fill="#334e68">PK id_cliente</text>
<text x="58" y="202" font-family="Segoe UI, sans-serif" font-size="17" fill="#334e68">Identificación única</text>
