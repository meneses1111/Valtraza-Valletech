# Propone actualizaciones como PR hacia develop; el CI las valida antes de integrarlas.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: Actualiza
    groups:
      laravel:
        patterns:
          - laravel/*
          - illuminate/*
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 3
    commit-message:
      prefix: Actualiza
