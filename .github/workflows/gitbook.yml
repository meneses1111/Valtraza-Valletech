name: Revisar GitBook

on:
  push:
    branches: [develop, main]
    paths: ['docs/**', 'herramientas/gitbook/**', '.github/workflows/gitbook.yml', 'README.md', '.gitignore']
  pull_request:
    branches: [develop, main]
    paths: ['docs/**', 'herramientas/gitbook/**', '.github/workflows/gitbook.yml', 'README.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar fuentes
        uses: actions/checkout@v6
      - name: Comprobar contenido e índice
        run: python3 herramientas/gitbook/verificar.py
      - name: Preparar Node exclusivo para GitBook
        uses: actions/setup-node@v6
        with:
          node-version: '10.24.1'
      - name: Instalar el generador fijado
        run: npm install --prefix herramientas/gitbook --ignore-scripts --no-audit
      - name: Compilar GitBook 3.2.2
        run: node herramientas/gitbook/compilar.cjs
      - name: Comprobar HTML y recursos generados
        run: python3 herramientas/gitbook/verificar.py --html _book
      - name: Preparar Node para revisar el navegador
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preparar revisión en Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/gitbook-browser" --ignore-scripts --no-audit --no-fund puppeteer-core@24.10.0
          echo "GITBOOK_BROWSER_MODULES=$RUNNER_TEMP/gitbook-browser/node_modules" >> "$GITHUB_ENV"
          echo "GITBOOK_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Revisar páginas y navegación en dos resoluciones
        env:
          GITBOOK_QA_OUTPUT: ${{ runner.temp }}/gitbook-qa
        run: node herramientas/gitbook/revisar-navegador.cjs
      - name: Revisar el libro bajo la ruta del repositorio
        env:
          GITBOOK_QA_OUTPUT: ${{ runner.temp }}/gitbook-qa/subruta
          GITBOOK_BASE_PATH: /Valtraza-Valletech
          GITBOOK_INDEX_REDIRECT: 'false'
        run: node herramientas/gitbook/revisar-navegador.cjs
      - name: Conservar vista previa
        uses: actions/upload-artifact@v4
        with:
          name: gitbook-vista-previa-${{ github.sha }}
          path: _book/
          if-no-files-found: error
          retention-days: 30
      - name: Conservar informe de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitbook-validacion-${{ github.sha }}
          path: ${{ runner.temp }}/gitbook-qa/
          if-no-files-found: ignore
          retention-days: 30

  publicar:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: libro
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el libro comprobado
        uses: actions/download-artifact@v4
        with:
          name: gitbook-vista-previa-${{ github.sha }}
          path: _book
      - name: Preparar solamente el sitio estático
        run: |
          rm _book/ABRIR-GITBOOK.cmd _book/abrir-vista-previa.cjs
          touch _book/.nojekyll
      - name: Conservar el sitio generado en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book
          publish_branch: gh-pages
          full_commit_message: Publico el GitBook de ${{ github.sha }}
      - name: Consultar la activación inicial de Pages
        id: pages
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const {data} = await github.rest.repos.getPages(context.repo);
              core.setOutput('activo', data.build_type === 'workflow' ? 'true' : 'false');
              if (data.build_type !== 'workflow') core.notice('Selecciona GitHub Actions en Settings > Pages > Source y vuelve a ejecutar este workflow sobre main.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('activo', 'false');
              core.notice('Libro generado. Falta activar Pages: Settings > Pages > Source > GitHub Actions. Después ejecuta de nuevo Revisar GitBook sobre main.');
            }
      - name: Preparar GitHub Pages
        if: steps.pages.outputs.activo == 'true'
        uses: actions/configure-pages@v5
      - name: Empaquetar el sitio para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book
      - name: Desplegar el libro
        if: steps.pages.outputs.activo == 'true'
        id: despliegue
        uses: actions/deploy-pages@v4
      - name: Registrar el estado de publicación
        env:
          PAGES_ACTIVO: ${{ steps.pages.outputs.activo }}
          PAGES_URL: ${{ steps.despliegue.outputs.page_url }}
        run: |
          if [ "$PAGES_ACTIVO" = true ]; then
            printf 'GitBook desplegado: %s\n' "$PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'El libro comprobado está en gh-pages. Falta la activación administrativa en Settings > Pages > Source > GitHub Actions y repetir este workflow sobre main. Todavía no se afirma una URL pública.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
